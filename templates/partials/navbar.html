<header class="crm-navbar">
    <button class="icon-btn d-lg-none" type="button" data-sidebar-toggle aria-label="Open sidebar">
        <i class="bi bi-list"></i>
    </button>
    <form class="nav-search" method="get" action="{% url 'vehicles:list' %}">
        <i class="bi bi-search"></i>
        <input type="search" name="q" value="{{ request.GET.q }}" placeholder="Search inventory">
    </form>
    <div class="nav-actions">
        <a class="icon-btn position-relative" href="{% url 'inbox:list' %}" title="Live Chat">
            <i class="bi bi-chat-dots"></i>
            {% if new_inquiry_count %}<span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size:0.6rem">{{ new_inquiry_count }}</span>{% endif %}
        </a>
        <div class="dropdown">
            <button class="profile-btn dropdown-toggle" type="button" data-bs-toggle="dropdown">
                <span class="avatar">{{ user.username|first|upper }}</span>
                <span class="d-none d-md-inline">{{ user.username }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><span class="dropdown-item-text text-muted">{{ user.get_role_display }}</span></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form action="{% url 'accounts:logout' %}" method="post">
                        {% csrf_token %}
                        <button class="dropdown-item" type="submit">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</header>

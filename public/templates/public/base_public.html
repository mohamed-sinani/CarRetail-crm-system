{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MotoRetail – Premium Cars{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --accent: #f59e0b;
            --accent-dark: #d97706;
            --dark: #0f172a;
            --darker: #020617;
            --text-light: #e2e8f0;
        }
        * { font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; }
        .public-nav {
            background: var(--dark);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,.25);
        }
        .public-nav .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .public-nav .navbar-brand span { color: var(--accent); }
        .public-nav .btn-outline-light { border-radius: 50px; font-weight: 600; }
        .public-nav .btn-outline-light:hover { background: var(--accent); border-color: var(--accent); color: var(--dark); }
        .hero {
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            padding: 5rem 0 4rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.5;
        }
        .hero h1 {
            font-size: 3.2rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: -1px;
            position: relative;
        }
        .hero h1 span { color: var(--accent); }
        .hero p {
            font-size: 1.15rem;
            color: #94a3b8;
            max-width: 600px;
            margin: 1rem auto 2rem;
            position: relative;
        }
        .hero .search-box {
            max-width: 550px;
            margin: 0 auto;
            position: relative;
        }
        .hero .search-box input {
            border-radius: 50px;
            padding: 0.85rem 1.5rem;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1rem;
            backdrop-filter: blur(10px);
            width: 100%;
        }
        .hero .search-box input::placeholder { color: #64748b; }
        .hero .search-box input:focus { outline: 2px solid var(--accent); background: rgba(255,255,255,0.15); }
        .hero .search-box button {
            position: absolute;
            right: 5px;
            top: 5px;
            border-radius: 50px;
            padding: 0.5rem 1.5rem;
            font-weight: 600;
            background: var(--accent);
            border: none;
            color: var(--dark);
        }
        .hero .search-box button:hover { background: var(--accent-dark); }
        .section-title {
            font-weight: 800;
            font-size: 1.75rem;
            color: var(--dark);
            letter-spacing: -0.5px;
        }
        .section-title span { color: var(--accent); }
        .vehicle-card {
            border: none;
            border-radius: 16px;
            overflow: hidden;
            transition: transform .25s ease, box-shadow .25s ease;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }
        .vehicle-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0,0,0,.12);
        }
        .vehicle-card .card-img-top {
            height: 220px;
            object-fit: cover;
            background: #e2e8f0;
        }
        .vehicle-card .card-body { padding: 1.25rem; }
        .vehicle-card .card-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }
        .vehicle-card .card-text { color: #64748b; font-size: 0.9rem; }
        .vehicle-card .price {
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--accent-dark);
        }
        .vehicle-card .badge {
            font-weight: 600;
            font-size: 0.75rem;
            padding: 0.35rem 0.65rem;
        }
        .vehicle-card .btn {
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            background: var(--dark);
            color: #fff;
            border: none;
            padding: 0.5rem 1.25rem;
        }
        .vehicle-card .btn:hover { background: var(--accent); color: var(--dark); }
        .public-footer {
            background: var(--dark);
            color: #94a3b8;
            padding: 2.5rem 0;
            text-align: center;
        }
        .public-footer strong { color: #fff; }
        .public-footer .brand { font-weight: 800; font-size: 1.2rem; color: #fff; }
        .public-footer .brand span { color: var(--accent); }
        .stat-badge {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-dark);
            font-weight: 700;
            padding: 0.15rem 0.6rem;
            border-radius: 50px;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <nav class="public-nav">
        <div class="container d-flex align-items-center justify-content-between">
            <a class="navbar-brand text-decoration-none" href="{% url 'public_home' %}">Moto<span>Retail</span></a>
            <div class="d-flex align-items-center gap-2">
                {% if user.is_authenticated %}
                    <span class="text-light small d-none d-sm-inline">{{ user.username }}</span>
                    <a href="{% url 'public_logout' %}" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </a>
                {% else %}
                    <a href="{% url 'public_login' %}" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-person"></i> Login
                    </a>
                    <a href="{% url 'public_register' %}" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-person-plus"></i> Register
                    </a>
                {% endif %}
                <a href="{% url 'accounts:login' %}" class="btn btn-outline-light btn-sm ms-2">
                    <i class="bi bi-lock"></i> Staff
                </a>
            </div>
        </div>
    </nav>
    {% block content %}{% endblock %}
    <footer class="public-footer">
        <div class="container">
            <div class="brand mb-2">Moto<span>Retail</span></div>
            <p class="mb-0 small">&copy; {% now "Y" %} MotoRetail – Premium Cars. All rights reserved.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

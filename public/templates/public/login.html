{% extends 'public/base_public.html' %}
{% block title %}Log In – MotoRetail{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container" style="max-width:480px">
        <h1 class="fw-bold mb-1">Customer Login</h1>
        <p class="text-muted mb-4">Log in to chat with our team.</p>
        <section class="panel p-4" style="background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)">
            <form method="post">
                {% csrf_token %}
                {% if messages %}
                    {% for msg in messages %}
                        <div class="alert alert-{{ msg.tags|default:'danger' }}">{{ msg }}</div>
                    {% endfor %}
                {% endif %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input class="form-control" name="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input class="form-control" name="password" type="password" required>
                </div>
                <button class="btn btn-dark w-100 rounded-pill py-2 fw-bold" type="submit"><i class="bi bi-box-arrow-in-right me-2"></i>Log In</button>
            </form>
        </section>
        <p class="text-center mt-3">No account? <a href="{% url 'public_register' %}">Register here</a></p>
    </div>
</section>
{% endblock %}
